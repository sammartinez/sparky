name: Daily brief

on:
  schedule:
    - cron: "0 12 * * *"
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

# A manual dispatch overlapping a scheduled run would race to push the same
# digest file. Queue them instead.
concurrency:
  group: daily-brief
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.18.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build daily brief
        run: npm run digest

      - name: Commit daily brief
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/digests data/seen.json
          if git diff --cached --quiet; then
            echo "No digest changes to commit."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "chore: publish daily brief"
            # Anything pushed to main since checkout (a human commit, say)
            # would otherwise make this push fail and lose the brief.
            git pull --rebase origin main
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Trigger site deploy
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --ref main
        # A push made with the default GITHUB_TOKEN does not trigger other
        # workflows (GitHub blocks this to avoid recursive runs), so
        # deploy.yml is dispatched explicitly here instead of relying on
        # its `push` trigger.
