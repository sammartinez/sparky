name: Daily brief

on:
  schedule:
    - cron: "0 12 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.18.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build daily brief
        run: npm run digest
        # env:
        #   ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Commit daily brief
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/digests data/seen.json
          if git diff --cached --quiet; then
            echo "No digest changes to commit."
          else
            git commit -m "chore: publish daily brief"
            git push
          fi
        # Pushing here triggers deploy.yml on main, which builds and
        # publishes the site — no separate deploy job needed in this workflow.
