name: CI

# Neither the daily brief nor the deploy workflow runs the test suite, so a
# broken ranker or template would only surface after it shipped.
on:
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.18.0
          cache: npm

      - run: npm ci
      - run: npm test
      - run: npm run check
      - run: npm run build
